<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Hasan Smajlović. An eye looks at the text and dwell-clicks on it.">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d"/>
    </pattern>
    <radialGradient id="iris" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="55%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f5f58"/>
    </radialGradient>
    <clipPath id="eyeShape">
      <path d="M60,150 Q170,40 280,150 Q170,260 60,150 Z"/>
    </clipPath>
  </defs>

  <rect width="1000" height="300" rx="18" fill="#0d1117"/>
  <rect width="1000" height="300" rx="18" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="#30363d"/>

  <!-- the eye -->
  <g clip-path="url(#eyeShape)">
    <rect x="50" y="80" width="240" height="140" fill="#161b22"/>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.1;0.3;0.4;0.6;0.7;0.9;1"
        values="0 0;22 -10;22 -10;26 4;26 4;20 14;20 14;0 0"/>
      <circle cx="170" cy="150" r="42" fill="url(#iris)"/>
      <circle cx="170" cy="150" r="42" fill="none" stroke="#0b3b37" stroke-width="3"/>
      <circle cx="170" cy="150" r="17" fill="#010409">
        <animate attributeName="r" dur="9s" repeatCount="indefinite"
          keyTimes="0;0.1;0.3;0.4;0.6;0.7;0.9;1" values="17;14;14;15;15;13;13;17"/>
      </circle>
      <circle cx="160" cy="138" r="6" fill="#ffffff" opacity="0.85"/>
    </g>
    <!-- eyelid blink -->
    <rect x="50" y="88" width="240" height="0" fill="#0d1117">
      <animate attributeName="height" dur="4.5s" repeatCount="indefinite"
        keyTimes="0;0.86;0.9;0.94;1" values="0;0;125;0;0"/>
    </rect>
  </g>
  <path d="M60,150 Q170,40 280,150 Q170,260 60,150 Z" fill="none" stroke="#e6edf3" stroke-width="3" stroke-linejoin="round"/>

  <!-- tracking status -->
  <circle cx="82" cy="262" r="4" fill="#3fb950">
    <animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" values="1;0.25;1"/>
  </circle>
  <text x="94" y="266" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8b949e">tracking: both eyes</text>

  <!-- text -->
  <text x="360" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#e6edf3">Hasan Smajlović</text>
  <text x="362" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#8b949e">Machine learning · Computer vision · Web</text>
  <text x="362" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#c9d1d9">I build software you can control with your <tspan fill="#2dd4bf">eyes</tspan>, <tspan fill="#2dd4bf">hands</tspan> and <tspan fill="#2dd4bf">voice</tspan>.</text>

  <!-- gaze point with dwell ring -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite"
      keyTimes="0;0.1;0.3;0.4;0.6;0.7;0.9;1"
      values="290 150;720 92;720 92;860 165;860 165;730 206;730 206;290 150"/>
    <circle r="7" fill="#f59e0b" opacity="0.55">
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.06;0.1;0.9;0.96;1" values="0;0;0.55;0.55;0;0"/>
    </circle>
    <circle r="18" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"
      stroke-dasharray="113" stroke-dashoffset="113" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.1;0.28;0.3;0.4;0.58;0.6;0.7;0.88;0.9;1"
        values="113;113;0;113;113;0;113;113;0;113;113"/>
    </circle>
    <!-- click pulse when the ring is full -->
    <circle r="18" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0">
      <animate attributeName="r" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.28;0.3;0.58;0.6;0.88;0.9;1" values="18;18;34;18;34;18;34;18"/>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.279;0.28;0.3;0.579;0.58;0.6;0.879;0.88;0.9;1" values="0;0;0.8;0;0;0.8;0;0;0.8;0;0"/>
    </circle>
  </g>

  <text x="976" y="276" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#484f58">pogled (bs.) = gaze</text>
</svg>
